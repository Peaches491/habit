# Example Habit config. Copy this to your own file (e.g. `habit.yaml`) and edit.
#
# Top-level keys:
#   title              : optional; shown at the top of the check-in form as
#                        "<title> - Check-in" (falls back to the user's name,
#                        then a generic heading, if omitted)
#   user, timezone     : optional metadata
#   lock_submitted_days: optional, default false; if true, a day that's
#                        already logged renders read-only in the web UI and
#                        rejects resubmission (days not yet logged stay
#                        editable either way)
#   goals              : the list of things you track (at least one)
#
# Each goal has:
#   name        : unique index key, no spaces (letters, digits, '_', '-')
#   description : the prompt / what it means
#   type        : bool | number | option
#   icon        : optional; an emoji or a Material Symbols icon name
#                 (https://fonts.google.com/icons), shown before the prompt
#   choices     : required for `option` goals; not allowed otherwise
#   shortcuts   : optional quick-select values for `number` goals (not judged)
#   value       : either a flat integer (points) OR a rule (a mapping with a
#                 `type`, encoding richer scoring)

title: Daily Habits
user: daniel
timezone: America/Chicago

goals:
  # A simple yes/no goal worth a flat 10 points.
  - name: exercise
    description: Did you exercise today?
    type: bool
    icon: fitness_center
    value: 10

  # A number goal scored by a threshold rule: 5 points if you hit >= 8.
  - name: water
    description: How many glasses of water did you drink today?
    type: number
    icon: "💧"
    shortcuts: [3, 5, 9]
    value:
      type: threshold
      at_least: 8
      points: 5

  # An option goal: pick one choice; points depend on which.
  - name: mood
    description: How was your mood today?
    type: option
    icon: mood
    choices: [great, ok, bad]
    value:
      type: options
      points_by_choice:
        great: 5
        ok: 2
        bad: 0

  # A goal the agent judges from your free-text entry (full points or zero).
  - name: journaling
    description: What did you reflect on today?
    type: bool
    value:
      type: judged
      judge: Award the points if the entry shows genuine reflection, not a token "nothing".
      points: 15
