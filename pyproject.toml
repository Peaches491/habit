[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "habit"
version = "0.1.0"
description = "A configurable habit tracker — config format and parser."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/habit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
